name: Update ENIB timetable

on:
  schedule:
    - cron: "0 5 * * *"  # daily at 05:00 UTC (~07:00 France time)
  workflow_dispatch: {}   # allows running it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated .ics back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and clean the timetable
        env:
          ENIB_USER: ${{ secrets.ENIB_USER }}
          ENIB_PASS: ${{ secrets.ENIB_PASS }}
          ENIB_STUDENT_NAME: ${{ secrets.ENIB_STUDENT_NAME }}
          ENIB_FROM_WEEK: ${{ secrets.ENIB_FROM_WEEK }}
          ENIB_TO_WEEK: ${{ secrets.ENIB_TO_WEEK }}
          ENIB_WEEKS_AHEAD: ${{ secrets.ENIB_WEEKS_AHEAD }}
        run: python3 fetch_edt.py timetable.ics

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add timetable.ics
          git diff --staged --quiet || git commit -m "Update timetable $(date -u +%Y-%m-%d)"
          git push
